<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析工作台</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Content Area */
        .content {
            padding: 30px;
        }

        /* Upload Section */
        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .upload-text p {
            color: #999;
            font-size: 14px;
        }

        /* Controls Section */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select,
        .control-group input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f2ff;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e8ebff;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Data Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            background: #f8f9ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f0f2ff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            white-space: nowrap;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        tbody tr:nth-child(even) {
            background: #fafbfc;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .chart-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .chart-container {
            min-height: 350px;
            width: 100%;
        }

        .chart-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .chart-btn {
            padding: 6px 12px;
            background: #f0f2ff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .chart-btn:hover {
            background: #667eea;
            color: white;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #f8f9ff;
        }

        .search-bar input::placeholder {
            color: #999;
        }

        /* Export Section */
        .export-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: #666;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .upload-area,
            .controls,
            .search-bar,
            .export-section,
            .section-title {
                display: none;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
            }

            .chart-card {
                page-break-inside: avoid;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success Message */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 数据分析工作台</h1>
            <p>Excel 数据可视化分析工具 | 支持图表导出 | 报表生成</p>
        </div>

        <div class="content">
            <!-- Message Area -->
            <div id="messageArea"></div>

            <!-- Upload Section -->
            <div class="section">
                <div class="section-title">📤 上传文件</div>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <h3>上传 Excel 文件</h3>
                        <p>支持 .xlsx 格式 | 拖拽或点击选择</p>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx" onchange="handleFileUpload(event)">
                </div>
            </div>

            <!-- Data Analysis Section -->
            <div id="analysisSection" style="display: none;">
                <!-- Sheet Selection -->
                <div class="section">
                    <div class="controls">
                        <div class="control-group">
                            <label>选择工作表</label>
                            <select id="sheetSelect" onchange="switchSheet(this.value)">
                                <option value="">-- 请选择 --</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>X 轴（分类）</label>
                            <select id="xAxisSelect" onchange="updateCharts()">
                                <option value="">-- 自动 --</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Y 轴（数值）</label>
                            <select id="yAxisSelect" onchange="updateCharts()">
                                <option value="">-- 自动 --</option>
                            </select>
                        </div>
                        <div class="button-group">
                            <button class="btn-primary btn-small" onclick="exportPDF()">📄 导出 PDF</button>
                        </div>
                    </div>
                </div>

                <!-- Search Section -->
                <div class="section">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="🔍 输入关键词搜索..." onkeyup="filterTable()">
                    </div>
                </div>

                <!-- Data Table -->
                <div class="section">
                    <div class="section-title">📋 数据表格</div>
                    <div class="table-wrapper">
                        <table id="dataTable">
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="emptyTable" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📭</div>
                        <h3>暂无数据</h3>
                        <p>上传 Excel 文件后，数据将显示在这里</p>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="section">
                    <div class="section-title">📊 可视化图表</div>
                    <div class="charts-grid" id="chartsGrid"></div>
                </div>
            </div>

            <!-- Initial Empty State -->
            <div id="initialEmpty" class="empty-state">
                <div class="empty-state-icon">📊</div>
                <h3>开始数据分析</h3>
                <p>上传 Excel 文件，开启数据探索之旅</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
